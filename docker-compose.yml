version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: mine_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: mine_inspection
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/home/postgres/pgdata/data
    restart: always